name: Deploy Astro Blog to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_REGION: asia-southeast1                # 新加坡（越南及东南亚超低延迟，直连海缆）
  GAR_REPOSITORY: blog-repo                 # GCP Artifact Registry 仓库名称
  SERVICE_NAME: astro-blog                  # Cloud Run 服务名称

# 开启 GitHub OIDC 身份令牌权限（用于 GCP 无密钥 Workload Identity 认证）
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2                    # 提取最近历史以供检测新增文章

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Sync images to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "⚠️ 未完整配置 R2 相关 Secrets，跳过图片增量同步。"
            exit 0
          fi

          # 1. 增量同步 attachments 目录（如果存在）
          if [ -d "./attachments" ]; then
            echo "📦 正在增量同步 ./attachments 到 Cloudflare R2..."
            aws s3 sync ./attachments "s3://${R2_BUCKET_NAME}/attachments" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --no-progress
          fi
          # 2. 增量同步 src/assets 下的图片附件（排除字体文件）
          if [ -d "./src/assets" ]; then
            echo "📦 正在增量同步 ./src/assets 图片附件到 Cloudflare R2..."
            aws s3 sync ./src/assets "s3://${R2_BUCKET_NAME}/attachments" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --exclude "*" \
              --include "*.png" --include "*.jpg" --include "*.jpeg" \
              --include "*.gif" --include "*.webp" --include "*.svg" --include "*.avif" \
              --no-progress
          fi

      - name: Set up Python for asset link replacement
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Replace asset links with Cloudflare R2 URLs
        env:
          R2_CDN_BASE_URL: ${{ secrets.R2_CDN_BASE_URL || vars.R2_CDN_BASE_URL }}
          POSTS_DIR: ./src/content/blog
        run: |
          if [ -n "$R2_CDN_BASE_URL" ]; then
            python scripts/sync_and_replace_assets.py --verbose
          else
            echo "⚠️ 未检测到 R2_CDN_BASE_URL 配置，跳过图片链接替换环节。"
          fi

      - name: Build and Tag Docker Image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          docker build \
            -t "${IMAGE_TAG}:${{ github.sha }}" \
            -t "${IMAGE_TAG}:latest" \
            .

      - name: Push Docker Image to Artifact Registry
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          docker push "${IMAGE_TAG}:${{ github.sha }}"
          docker push "${IMAGE_TAG}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --memory=256Mi
            --cpu=1

      - name: Show Output Service URL
        run: |
          echo "🚀 Astro Blog successfully deployed to: ${{ steps.deploy.outputs.url }}"

      - name: Auto-post new article to Mastodon
        if: success()
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE || 'https://mastodon.social' }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/post-to-mastodon.mjs
