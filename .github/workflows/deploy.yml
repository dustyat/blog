name: Deploy Astro Blog to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2                    # 提取最近历史以供检测新增文章

      - name: Sync images to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "⚠️ 未完整配置 R2 相关 Secrets，跳过图片增量同步。"
            exit 0
          fi

          # 1. 增量同步 attachments 目录（如果存在）
          if [ -d "./attachments" ]; then
            echo "📦 正在增量同步 ./attachments 到 Cloudflare R2..."
            aws s3 sync ./attachments "s3://${R2_BUCKET_NAME}/attachments" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --no-progress
          fi
          # 2. 增量同步 src/content/blog/attachments 目录（如果存在）
          if [ -d "./src/content/blog/attachments" ]; then
            echo "📦 正在增量同步 ./src/content/blog/attachments 到 Cloudflare R2..."
            aws s3 sync ./src/content/blog/attachments "s3://${R2_BUCKET_NAME}/attachments" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --no-progress
          fi
          # 3. 增量同步 src/assets 下的图片附件（排除字体文件）
          if [ -d "./src/assets" ]; then
            echo "📦 正在增量同步 ./src/assets 图片附件到 Cloudflare R2..."
            aws s3 sync ./src/assets "s3://${R2_BUCKET_NAME}/attachments" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --exclude "*" \
              --include "*.png" --include "*.jpg" --include "*.jpeg" \
              --include "*.gif" --include "*.webp" --include "*.svg" --include "*.avif" \
              --no-progress
          fi

      - name: Set up Python for asset link replacement
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Replace asset links with Cloudflare R2 URLs
        env:
          R2_CDN_BASE_URL: ${{ secrets.R2_CDN_BASE_URL || vars.R2_CDN_BASE_URL }}
          POSTS_DIR: ./src/content/blog
        run: |
          if [ -n "$R2_CDN_BASE_URL" ]; then
            python scripts/sync_and_replace_assets.py --verbose
          else
            echo "⚠️ 未检测到 R2_CDN_BASE_URL 配置，跳过图片链接替换环节。"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static blog
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}

      - name: Auto-post new article to Mastodon
        if: success()
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE || 'https://mastodon.social' }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          SITE_URL: 'https://blog.dustyat.com'
        run: |
          node scripts/post-to-mastodon.mjs

