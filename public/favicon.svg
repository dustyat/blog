<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Caveat:wght@700&amp;display=swap');
      .cursive-d {
        font-family: 'Dancing Script', 'Caveat', 'Segoe Script', 'Brush Script MT', cursive;
        font-size: 104px;
        font-weight: 700;
        font-style: italic;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Pure Black Circle Background -->
  <circle cx="64" cy="64" r="64" fill="#000000" />

  <!-- Elegant White Cursive Letter 'd' -->
